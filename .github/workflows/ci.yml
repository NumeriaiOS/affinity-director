name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Test
        run: pytest -q
      - name: Synthetic orchestration evaluation
        run: python tools/evaluate_agent.py
      - name: Secret scan
        run: python tools/secret_scan.py
      - name: Diff check
        run: git diff --check
